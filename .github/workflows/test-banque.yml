name: Vérifier les exercices de maths

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier la syntaxe Python
        run: python -m py_compile app.py banque_priorites.py test_banque_priorites.py
      - name: Tester les banques d'exercices
        run: python -m unittest discover -p "test_*.py" -v
